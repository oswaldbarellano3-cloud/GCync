<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GCync | Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="intro" aria-label="GCync introduction">
      <header class="brand">
        <div class="brand-title">
          <span class="brand-icon" aria-hidden="true">▦</span>
          <h1>GCync</h1>
        </div>
        <p>GORDON COLLEGE CALENDAR SYNC</p>
      </header>

      <img class="mascot" src="mascot.png" alt="GCync calendar mascot">
    </section>

    <section class="login-card" aria-labelledby="welcome-title">
      <div class="card-content">
        <h2 id="welcome-title">WELCOME!</h2>
        <p class="subtitle">Log in to continue to your account.</p>

        <form action="#" method="post">
          <div class="form-group">
            <label for="email">EMAIL ADDRESS:</label>
            <input id="email" name="email" type="email" placeholder="Enter your email address" required>
          </div>

          <div class="form-group password-group">
            <label for="password">PASSWORD:</label>
            <input id="password" name="password" type="password" placeholder="Enter password" required>
          </div>

          <div class="form-options">
            <label class="remember">
              <input type="checkbox" name="remember">
              <span>Remember me</span>
            </label>
            <a href="#">Forgot password?</a>
          </div>

          <button type="submit">LOG IN</button>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
